# ---------------------------------------------------------------------------
# DMF plant model — the single source of truth for the line topology.
#
# Keys are POSITIONS on the line (the numbers in the blueprint, Figure 1 of the
# PLC documentation). The physical cell standing at a position can change, so
# `cell` is configuration. OPC UA objects `ZelleN` are addressed by position.
#
# Provenance of the values (see docs/01-project-analysis.md):
#   cell numbers  — project description table (= PLC documentation table)
#   type / ports  — PLC program Konfig_DB (Linear: Eingangsport; Splitter:
#                   Eingang/Ziel/Alternativ; Merger: Primär/Sekundär/Ausgang)
#   connections   — Figure 1 arrows + design "next cell"; NOT in the PLC
#                   project ("Zellen verbinden: TO DO")  -> verify in the lab
#   layout        — Figma "Team 11 DMF – Dashboard v2 (blueprint layout)"
# ---------------------------------------------------------------------------
plant:
  name: Digital Model Factory

# Cell types
#   linear   : ports 1,2; conveyors 1..3; input_port decides the direction
#   splitter : ports 1,2,3; conveyors 1..5 (2 = turntable); 1 in, 2 out
#   merger   : ports 1,2,3; conveyors 1..5 (2 = turntable); 2 in, 1 out
positions:
  1:  {cell: 1,  retrofit: true,  type: linear,   input_port: 1}
  2:  {cell: 11, retrofit: false, type: merger,   primary_port: 3, secondary_port: 1, output_port: 2}
  3:  {cell: 12, retrofit: false, type: merger,   primary_port: 3, secondary_port: 1, output_port: 2}
  4:  {cell: 14, retrofit: false, type: linear,   input_port: 1}
  5:  {cell: 13, retrofit: false, type: splitter, input_port: 1, target_port: 2, alternative_port: 3}
  6:  {cell: 6,  retrofit: true,  type: linear,   input_port: 1}
  7:  {cell: 4,  retrofit: true,  type: merger,   primary_port: 3, secondary_port: 1, output_port: 2}
  8:  {cell: 7,  retrofit: true,  type: linear,   input_port: 1}
  9:  {cell: 8,  retrofit: true,  type: splitter, input_port: 1, target_port: 2, alternative_port: 3}
  10: {cell: 5,  retrofit: true,  type: linear,   input_port: 1}
  11: {cell: 15, retrofit: false, type: linear,   input_port: 1}
  12: {cell: 18, retrofit: false, type: linear,   input_port: 1}
  13: {cell: 19, retrofit: false, type: linear,   input_port: 1}
  14: {cell: 16, retrofit: false, type: merger,   primary_port: 3, secondary_port: 1, output_port: 2}
  15: {cell: 17, retrofit: false, type: merger,   primary_port: 3, secondary_port: 1, output_port: 2}
  16: {cell: 20, retrofit: false, type: linear,   input_port: 1}
  17: {cell: 2,  retrofit: true,  type: merger,   primary_port: 1, secondary_port: 3, output_port: 2}
  18: {cell: 3,  retrofit: true,  type: merger,   primary_port: 1, secondary_port: 3, output_port: 2}

# Direct conveyor-to-conveyor connections: output port -> input port.
connections:
  - {from: [1, 2],  to: [2, 3]}
  - {from: [2, 2],  to: [3, 1]}
  - {from: [3, 2],  to: [4, 1]}
  - {from: [4, 2],  to: [5, 1]}
  - {from: [5, 2],  to: [11, 1]}   # splitter target (1st priority)
  - {from: [5, 3],  to: [6, 1]}    # splitter alternative (2nd priority)
  - {from: [6, 2],  to: [7, 3]}
  - {from: [7, 2],  to: [8, 1]}
  - {from: [8, 2],  to: [9, 1]}
  - {from: [9, 3],  to: [10, 1]}   # splitter alternative: keep circulating
  - {from: [10, 2], to: [3, 3]}
  - {from: [12, 2], to: [13, 1]}
  - {from: [13, 2], to: [14, 3]}
  - {from: [15, 2], to: [16, 1]}
  - {from: [16, 2], to: [17, 1]}
  - {from: [18, 2], to: [7, 1]}

# Transfers done by a robot (not tracked): FIFO hand-over with a time limit.
robot_links:
  - {from: [11, 2], to: [12, 1], name: Robot, max_transit_s: 300}
  - {from: [17, 2], to: [18, 1], name: Robot, max_transit_s: 300}
  # 14 -> 15 is NOT a PLC hand-over: the PLC configuration (Konfig_DB neighbour wiring)
  # has no 14/15 neighbours and the plant drawing shows a gap with a robot/table between
  # them. Modelled like the robot transfers (FIFO). LAB VERIFICATION REQUIRED (docs/08 3.4).
  - {from: [14, 2], to: [15, 3], name: Robot, max_transit_s: 300}

# Untracked endpoints. A piece arriving from a source gets a new number; a piece
# leaving into a sink leaves the factory (status "stored").
external:
  - {at: [1, 1],  kind: source, name: High-bay storage}
  - {at: [9, 2],  kind: sink,   name: Storage}            # splitter target: take out to storage
  - {at: [2, 1],  kind: source, name: Side entry}
  - {at: [14, 1], kind: source, name: Side entry}
  - {at: [15, 1], kind: source, name: Side entry}
  - {at: [17, 3], kind: source, name: Small storage}
  - {at: [18, 3], kind: source, name: Robot}


# nginx for the DMF dashboard: static SPA + reverse proxy to the backend.
# Runs unprivileged on port 8080 inside the container (nginxinc/nginx-unprivileged).

map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

# Strict policy for the dashboard itself (all scripts, styles and fonts are bundled).
map $uri $dmf_csp {
  default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
  # FastAPI's Swagger UI page uses an inline script and loads its assets from jsDelivr
  # (needs internet access from the browser; /api/openapi.json works offline).
  /api/docs "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'";
}

server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  client_max_body_size 16k;   # the dashboard only sends GET requests

  # Docker's embedded DNS. The backend address is looked up per request (cached 10 s),
  # so a restarted backend container with a new IP is found again.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $dmf_backend http://backend:8000;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/csv;
  gzip_min_length 1024;

  include /etc/nginx/snippets/security-headers.conf;
  add_header Content-Security-Policy $dmf_csp always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # The project description names /docs for the automatic API documentation.
  location = /docs {
    return 302 /api/docs;
  }

  location /api/ {
    # only GET/HEAD are used by the dashboard; reject anything else at the edge
    limit_except GET HEAD { deny all; }
    proxy_pass $dmf_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;  # with port: the backend compares it with the browser Origin
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;  # PDF exports of long ranges
  }

  location /ws/ {
    proxy_pass $dmf_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;  # with port: the backend compares it with the browser Origin
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Content-Security-Policy $dmf_csp always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Content-Security-Policy $dmf_csp always;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
